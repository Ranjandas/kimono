name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install fonttools (font subsetting)
        run: pipx install fonttools==4.67.0

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build, check (unit tests, screenshots, lint, ktlint, Detekt)
        run: ./gradlew assembleDebug assembleBenchmark check verifyRoborazziDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: kimono-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          # Artifacts count against the account's storage, which ran out once (#160); a build's APKs are only
          # wanted for the device check that follows it.
          retention-days: 14

      - name: Upload benchmark APK
        uses: actions/upload-artifact@v7
        with:
          name: kimono-benchmark-apk
          path: app/build/outputs/apk/benchmark/*.apk
          if-no-files-found: error
          retention-days: 14

      # Fresh screenshots to commit when a screen changed on purpose (docs/DEVELOPING.md).
      - name: Record screenshots
        if: failure()
        run: ./gradlew recordRoborazziDebug --stacktrace

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: feature/*/src/test/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload check reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/detekt/
            **/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 7
