name: Release

# Push a tag like v0.2.0 to build a signed release APK and publish it to GitHub Releases, with notes generated
# from the merged PRs (.github/release.yml groups them). See docs/DEVELOPING.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install fonttools (font subsetting)
        run: pipx install fonttools==4.67.0

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # v1.2.3 becomes versionName 1.2.3 and versionCode 10203.
      - name: Version from the tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "${name%%-*}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Decode the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KIMONO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KIMONO_RELEASE_KEYSTORE_BASE64 isn't set; see docs/DEVELOPING.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        env:
          KIMONO_RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          KIMONO_RELEASE_STORE_PASSWORD: ${{ secrets.KIMONO_RELEASE_STORE_PASSWORD }}
          KIMONO_RELEASE_KEY_ALIAS: ${{ secrets.KIMONO_RELEASE_KEY_ALIAS }}
          KIMONO_RELEASE_KEY_PASSWORD: ${{ secrets.KIMONO_RELEASE_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease --stacktrace
          -Pkimono.versionName=${{ steps.version.outputs.name }}
          -Pkimono.versionCode=${{ steps.version.outputs.code }}

      - name: Check the signature
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$apk"
          cp "$apk" "kimono-${{ steps.version.outputs.name }}.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "kimono-${{ steps.version.outputs.name }}.apk"
          --title "Kimono Launcher ${{ steps.version.outputs.name }}"
          --generate-notes
          ${{ contains(steps.version.outputs.name, '-') && '--prerelease' || '' }}

      - name: Remove the decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
