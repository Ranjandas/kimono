name: Release

# Push a tag like v0.2.0 to build a signed release APK and app bundle and publish them to GitHub Releases, with notes generated
# from the merged PRs (.github/release.yml groups them). See docs/DEVELOPING.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install fonttools (font subsetting)
        run: pipx install fonttools==4.67.0

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # v1.2.3 becomes versionName 1.2.3 and versionCode 1020399; v1.2.3-rc4 becomes 1020304. A release candidate
      # always numbers below its final release, since Play never takes the same versionCode twice.
      - name: Version from the tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "${name%%-*}"
          build=99
          if [[ "$name" == *-* ]]; then
            build="${name##*[!0-9]}"
            if [ -z "$build" ] || [ "$build" -ge 99 ]; then
              echo "::error::a pre-release tag must end in a number below 99, such as v1.2.3-rc1"
              exit 1
            fi
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$(((major * 10000 + minor * 100 + patch) * 100 + build))" >> "$GITHUB_OUTPUT"

      - name: Decode the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KIMONO_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KIMONO_RELEASE_KEYSTORE_BASE64 isn't set; see docs/DEVELOPING.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK and app bundle
        env:
          KIMONO_RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          KIMONO_RELEASE_STORE_PASSWORD: ${{ secrets.KIMONO_RELEASE_STORE_PASSWORD }}
          KIMONO_RELEASE_KEY_ALIAS: ${{ secrets.KIMONO_RELEASE_KEY_ALIAS }}
          KIMONO_RELEASE_KEY_PASSWORD: ${{ secrets.KIMONO_RELEASE_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease bundleRelease --stacktrace
          -Pkimono.versionName=${{ steps.version.outputs.name }}
          -Pkimono.versionCode=${{ steps.version.outputs.code }}

      # Play needs an app bundle (the .aab); the APK is for sideloading. Since August 2026, TV apps must also
      # support 16 KB memory pages, so every native library has to be 16 KB aligned.
      - name: Check the signatures and 16 KB alignment
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)"
          apk=$(ls app/build/outputs/apk/release/*.apk)
          aab=$(ls app/build/outputs/bundle/release/*.aab)
          "$tools"/apksigner verify --print-certs "$apk"
          jarsigner -verify "$aab" | tail -1
          "$tools"/zipalign -c -P 16 -v 4 "$apk" | tail -1
          mkdir -p "$RUNNER_TEMP/lib" && unzip -q -o "$apk" 'lib/*' -d "$RUNNER_TEMP/lib" || true
          bad=0
          for so in $(find "$RUNNER_TEMP/lib" -name '*.so'); do
            case "$so" in */arm64-v8a/*|*/x86_64/*) ;; *) continue ;; esac
            align=$(objdump -p "$so" | awk '/LOAD/ { print $NF; exit }')
            if [ $((align)) -lt 16384 ]; then echo "::error::$so is aligned to $align, not 16 KB"; bad=1; fi
          done
          [ "$bad" -eq 0 ]
          cp "$apk" "kimono-${{ steps.version.outputs.name }}.apk"
          cp "$aab" "kimono-${{ steps.version.outputs.name }}.aab"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "kimono-${{ steps.version.outputs.name }}.apk" "kimono-${{ steps.version.outputs.name }}.aab"
          --title "Kimono Launcher ${{ steps.version.outputs.name }}"
          --generate-notes
          ${{ contains(steps.version.outputs.name, '-') && '--prerelease' || '' }}

      - name: Remove the decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
