name: Bug
description: Something doesn't work as it should.
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. 
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Google TV Streamer, Android 14
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kimono version or commit
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: "`adb logcat` output, screenshots or a short video."
      render: shell
