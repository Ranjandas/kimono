[versions]
agp = "9.4.1"
kotlin = "2.4.21"
compileSdk = "37"
targetSdk = "37"
minSdk = "31"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
composeBom = "2026.09.00"
tvMaterial = "1.1.0"
junit = "6.1.3"
coroutines = "1.11.0"
datastore = "1.3.0"
turbine = "1.2.1"
ksp = "2.3.12"
room = "2.8.5"
work = "2.12.0"
robolectric = "4.17"
roborazzi = "1.76.0"
junit4 = "4.13.2"
spotless = "8.10.4"
ktlint = "1.8.0"
