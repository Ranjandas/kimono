# Overrides on top of Detekt's default config (buildUponDefaultConfig = true).

config:
  # The Compose rules plugin doesn't declare its options to Detekt's config validation.
  excludes: 'Compose>.*'

naming:
  FunctionNaming:
    # Composables are PascalCase.
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    # Colours, dp values and sizes in Compose code are clearer inline.
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreEnums: true
    excludes: ['**/test/**', '**/androidTest/**']
    ignoreAnnotated: ['Composable', 'Preview']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']

complexity:
  LongParameterList:
    # Composables take many optional parameters by design.
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']

Compose:
  ModifierMissing:
    active: true
  CompositionLocalAllowlist:
    # The theme's tokens are the only CompositionLocals; everything else is passed as parameters.
    allowedCompositionLocals:
      - LocalKimonoColors
      - LocalKimonoShapes
      - LocalKimonoTypography
