<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Noto; src: url(../../core/design/fonts/NotoSans-Medium.ttf); font-weight: 500; }
@font-face { font-family: Noto; src: url(../../core/design/fonts/NotoSans-Regular.ttf); font-weight: 400; }
html,body { margin:0; background:#000; }
.c { position:absolute; left:0; top:0; background:#000; display:flex; align-items:center; justify-content:center; font-family:Noto; color:#dcd6ca; }
.w { font-weight:500; letter-spacing:-0.01em; line-height:1; }
.t { font-weight:400; color:#8f8896; line-height:1.2; }
svg { display:block; }
</style></head><body><div id="c" class="c"></div>
<script>
const mark = (vb) => `<svg viewBox="${vb}" width="100%" height="100%"><rect width="108" height="108" fill="#000"/>
 <g transform="translate(54 55) scale(0.88) translate(-54 -55)">
 <path fill="#F2543D" d="M45,25 L63,25 L83,32 Q86,33 86,36 L86,57 Q86,62 81,62 L72,62 Q69,62 69,59 L69,46 L71.5,86 L36.5,86 L39,46 L39,59 Q39,62 36,62 L27,62 Q22,62 22,57 L22,36 Q22,33 25,32 Z"/>
 <path d="M39,44 L39,60 M69,44 L69,60 M45,67 L44,86" stroke="#000" stroke-width="2"/>
 <path fill="#000" d="M47,25 L61,25 L54,41 Z"/>
 <path d="M60.5,25 L43.5,58" stroke="#000" stroke-width="3" fill="none"/>
 <rect fill="#E6B84A" x="38.2" y="57" width="31.6" height="10"/></g></svg>`;
const k = new URLSearchParams(location.search).get('k');
const c = document.getElementById('c');
const S = { banner:[640,360], tv:[1280,720], icon:[512,512], feature:[1024,500] }[k];
c.style.width = S[0]+'px'; c.style.height = S[1]+'px';
const u = S[1]/360;
if (k === 'icon') c.innerHTML = `<div style="width:512px;height:512px">${mark('12 12 84 84')}</div>`;
else if (k === 'feature') c.innerHTML = `<div style="display:flex;align-items:center;gap:40px">
  <div style="width:220px;height:220px">${mark('23 23 62 62')}</div>
  <div><div class="w" style="font-size:96px">Kimono</div><div class="t" style="font-size:36px;margin-top:14px">A calm home screen for Google TV</div></div></div>`;
else c.innerHTML = `<div style="display:flex;align-items:center;gap:${30*u}px">
  <div style="width:${120*u}px;height:${120*u}px">${mark('23 23 62 62')}</div>
  <div class="w" style="font-size:${104*u}px;margin-top:${-8*u}px">Kimono</div></div>`;
</script></body></html>
